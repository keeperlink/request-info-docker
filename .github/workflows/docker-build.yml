name: Build Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-info-docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE: keeperlink/request-info-docker
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Build once with both tags
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      # Test before publishing
      - name: Smoke test
        run: |
          docker run -d --name request-info-test \
            -p 127.0.0.1:18080:8080 \
            "$IMAGE:$VERSION"

          trap 'docker rm -f request-info-test || true' EXIT

          curl --fail --show-error --silent \
            --retry 5 --retry-connrefused --retry-delay 1 \
            "http://127.0.0.1:18080/test?hello=world" \
            | grep -Fq "hello=world"

          echo "Smoke test PASSED"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Publish both tags for the tested image
      - name: Push image
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

          echo "Published:"
          echo "  $IMAGE:$VERSION"
          echo "  $IMAGE:latest"
